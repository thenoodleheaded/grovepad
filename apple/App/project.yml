# The native Grovepad app for macOS, iOS and iPadOS — one multiplatform
# target that assembles the Swift package at `..` (GrovepadApp and the
# libraries under it). Regenerate the project after editing this file:
#
#   cd apple/App && xcodegen generate
#
# Bundle id: `app.grovepad.native` — deliberately NOT the Tauri app's
# `app.grovepad`, so both can be installed on one device while the port is
# built (the README explains what changes when it takes over the id).
# Extensions: `GrovepadNoteWidget` (WidgetKit: Note + Grovepad Widget) and `GrovepadQuickLook`
# (Quick Look preview), both multiplatform, embedded by the app target.
name: Grovepad
options:
  bundleIdPrefix: app.grovepad
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Supabase.xcconfig
  Release: Config/Supabase.xcconfig
packages:
  Grovepad:
    path: ..
settings:
  base:
    DEVELOPMENT_TEAM: 4BV47RN242
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
targets:
  Grovepad:
    type: application
    supportedDestinations: [iOS, iPad, macOS]
    sources:
      - path: Sources
      - path: Assets.xcassets
    dependencies:
      - package: Grovepad
        product: GrovepadApp
      - package: Grovepad
        product: GrovepadChrome
      - package: Grovepad
        product: GrovepadCanvas
      - package: Grovepad
        product: GrovepadCore
      - package: Grovepad
        product: GrovepadCloud
      - package: Grovepad
        product: GrovepadCollaboration
      # Phase 7 extensions, embedded in the app on every destination.
      - target: GrovepadNoteWidget
      - target: GrovepadQuickLook
    settings:
      base:
        PRODUCT_NAME: Grovepad
        PRODUCT_BUNDLE_IDENTIFIER: app.grovepad.native
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: true
        ENABLE_APP_SANDBOX: true
        SWIFT_STRICT_CONCURRENCY: minimal
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: false
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Grovepad
        CFBundleName: Grovepad
        # iPhone ProMotion: without this, UIKit caps every animation at 60 Hz.
        CADisableMinimumFrameDurationOnPhone: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en]
        CFBundleAllowMixedLocalizations: true
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: © Grovepad
        # The two cloud entries; blank keeps the app in guest mode (CloudSettings).
        GROVEPAD_SUPABASE_URL: $(GROVEPAD_SUPABASE_URL)
        GROVEPAD_SUPABASE_ANON_KEY: $(GROVEPAD_SUPABASE_ANON_KEY)
        # iOS: the flat ground (#080a09) so a cold launch never flashes white.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: false
        UIRequiredDeviceCapabilities: [arm64]
        LSSupportsOpeningDocumentsInPlace: true
        UISupportsDocumentBrowser: false
        # Handoff / restoration: the active canvas (`CanvasActivityPayload`).
        NSUserActivityTypes: [app.grovepad.native.canvas]
        # The `.grovepad` document: a ZIP archive we export and open.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: app.grovepad.board
            UTTypeDescription: Grovepad board
            UTTypeConformsTo: [public.zip-archive, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [grovepad]
              public.mime-type: [application/vnd.grovepad.board+zip]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Grovepad board
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes: [app.grovepad.board]
        # The auth callback (magic link, OAuth): grovepad://auth/callback.
        CFBundleURLTypes:
          - CFBundleURLName: app.grovepad.auth
            CFBundleURLSchemes: [grovepad]
            CFBundleTypeRole: Viewer
    entitlements:
      path: Grovepad.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        # Sandbox + the network for Supabase and the account Worker; user-chosen
        # files for open / export.
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        # The WidgetKit Note widget's shared container (phase 7): the App
        # Group must exist in the developer account before a signed build works.
        com.apple.security.application-groups: [group.app.grovepad.native]
    scheme:
      testTargets: []
      gatherCoverageData: false

  # The WidgetKit extension (docs/native-os-widgets.md): the Note widget and
  # the Grovepad Widget, both reading files the app writes into the App Group
  # container. Links only the small GrovepadHomeWidget contract module.
  GrovepadNoteWidget:
    type: app-extension
    supportedDestinations: [iOS, iPad, macOS]
    sources:
      - path: NoteWidget
        excludes: ["*.entitlements"]
    dependencies:
      - package: Grovepad
        product: GrovepadHomeWidget
    settings:
      base:
        PRODUCT_NAME: GrovepadNoteWidget
        PRODUCT_BUNDLE_IDENTIFIER: app.grovepad.native.NoteWidget
        GENERATE_INFOPLIST_FILE: false
        SWIFT_STRICT_CONCURRENCY: minimal
        ENABLE_APP_SANDBOX: true
        ENABLE_HARDENED_RUNTIME: true
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: true
        SUPPORTS_MACCATALYST: false
    info:
      path: NoteWidget/Info.plist
      properties:
        CFBundleDisplayName: Grovepad Note
        CFBundleName: GrovepadNoteWidget
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHumanReadableCopyright: © Grovepad
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: NoteWidget/GrovepadNoteWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [group.app.grovepad.native]

  # Quick Look for `.grovepad` files: reads the package with GrovepadCore and
  # shows `PackageSummary` (workspaces, canvases, card counts, first titles).
  GrovepadQuickLook:
    type: app-extension
    supportedDestinations: [iOS, iPad, macOS]
    sources:
      - path: QuickLook
        excludes: ["*.entitlements"]
    dependencies:
      - package: Grovepad
        product: GrovepadCore
    settings:
      base:
        PRODUCT_NAME: GrovepadQuickLook
        PRODUCT_BUNDLE_IDENTIFIER: app.grovepad.native.QuickLook
        GENERATE_INFOPLIST_FILE: false
        SWIFT_STRICT_CONCURRENCY: minimal
        ENABLE_APP_SANDBOX: true
        ENABLE_HARDENED_RUNTIME: true
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: true
        SUPPORTS_MACCATALYST: false
    info:
      path: QuickLook/Info.plist
      properties:
        CFBundleDisplayName: Grovepad Quick Look
        CFBundleName: GrovepadQuickLook
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHumanReadableCopyright: © Grovepad
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewViewController
          NSExtensionAttributes:
            QLSupportedContentTypes: [app.grovepad.board]
            QLSupportsSearchableItems: false
            QLIsDataBasedPreview: false
    entitlements:
      path: QuickLook/GrovepadQuickLook.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
