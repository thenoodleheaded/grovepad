[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
base64 = "0.22"
tauri-plugin-native-widget = { path = "plugins/native-widget" }
tauri-plugin-native-auth = { path = "plugins/native-auth" }
tauri-plugin-native-haptics = { path = "plugins/native-haptics" }
tauri-plugin-native-share = { path = "plugins/native-share" }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

# iOS only: lets the WKWebView fill the whole screen (see
# ios_disable_safe_area_insets in src/lib.rs). Already in the lock through wry;
# pinned to that same version so no second copy is built.
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6.4"
