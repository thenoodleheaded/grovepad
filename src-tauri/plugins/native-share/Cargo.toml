[package]
name = "tauri-plugin-native-share"
version = "0.1.0"
authors = ["Grovepad"]
description = "System share sheet bridge for Grovepad file exports"
edition = "2021"
rust-version = "1.77.2"
links = "tauri-plugin-native-share"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.3" }
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2.6.3", features = ["build"] }
