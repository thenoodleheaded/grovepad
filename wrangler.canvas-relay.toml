name = "grovepad-canvas-relay"
main = "worker/index.ts"
compatibility_date = "2026-07-28"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

routes = [
  { pattern = "grovepad.app/api/canvas-lms*", zone_name = "grovepad.app" },
  { pattern = "www.grovepad.app/api/canvas-lms*", zone_name = "grovepad.app" }
]

[[ratelimits]]
name = "CANVAS_RELAY_RATE_LIMITER"
namespace_id = "731001"

  [ratelimits.simple]
  limit = 60
  period = 60
